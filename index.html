<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global CSS Resetter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Global CSS Resetter</h1>
        <p>This page includes some basic styling. It also contains an iframe, which has its own styles.</p>
        <p>Click the button below to inject a CSS reset that targets <strong>every element on this page, in the iframe, and in any parent frames.</strong></p>
        
        <button id="resetButton">Reset All CSS</button>

        <div class="box">I am a styled box.</div>

        <h2>Iframe Content Below</h2>
        <iframe id="demo-iframe" srcdoc="
            <!DOCTYPE html>
            <html>
            <head>
                <link rel='stylesheet' href='style.css'>
            </head>
            <body>
                <div class='container'>
                    <h3>Inside the iFrame</h3>
                    <p>This content is inside an iframe. It also has styles applied.</p>
                    <div class='box iframe-box'>I'm another styled box, but inside the frame.</div>
                </div>
            </body>
            </html>
        "></iframe>
    </div>

    <script type="module" src="script.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
